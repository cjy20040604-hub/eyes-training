name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unit + component tests; fails if coverage drops below the floors in vite.config.ts.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
      # Production build: must contain the anti-framing guard and no end-to-end test hooks.
      - run: npm run build
      - name: Check the production build
        run: |
          test -f dist/frame-guard.js
          grep -q 'frame-guard.js' dist/index.html
          if grep -rq '__bvProbe' dist; then echo 'test hooks leaked into the production build'; exit 1; fi
      # End-to-end tests build their own e2e-mode copy (dist-e2e) and serve it on localhost.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      # Rebuild for GitHub Pages, which serves under /<repo>/. Hash routing means only
      # asset URLs depend on this base path.
      - run: npm run build
        if: github.ref == 'refs/heads/main'
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Smoke tests against the live site: sub-path assets, no errors, no foreign requests,
  # anti-framing guard, no test hooks, on-demand language loading, offline use.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.live.config.ts
        env:
          CI: 'true'
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: test-results
